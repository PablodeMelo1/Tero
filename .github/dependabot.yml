version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directories: [/src/ui, /src/admin, /src/checkout]
    schedule: {interval: weekly}
    groups:
      development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /src/cart
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directories: [/src/catalog, /src/orders]
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/src/ui, /src/admin, /src/checkout, /src/cart, /src/catalog, /src/orders]
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}
