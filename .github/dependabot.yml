version: 2
# Two version-update PRs per entry; this is not a repository-wide limit.
# allow.update-types only filters routine version updates, not security updates.
# Runtime migrations must also update CI and pass integration tests.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: [/src/ui, /src/admin, /src/checkout]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /src/cart
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      testing:
        patterns: ["pytest", "pytest-cov", "httpx", "coverage"]
      production:
        patterns: ["*"]
        exclude-patterns: ["pytest", "pytest-cov", "httpx", "coverage"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/src/catalog, /src/orders]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]
      gorm:
        patterns: ["gorm.io/*"]
      prometheus:
        patterns: ["github.com/zsais/go-gin-prometheus", "github.com/prometheus/*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/src/ui, /src/admin, /src/checkout, /src/cart, /src/catalog, /src/orders]
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      infrastructure:
        patterns: ["*"]
