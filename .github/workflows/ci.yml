name: Reusable CI checks

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  typescript:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [ui, admin, checkout]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        working-directory: src/${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [[ "$SERVICE" == checkout ]]; then
            node .yarn/releases/yarn-4.11.0.cjs install --immutable
          else
            npm ci --ignore-scripts
          fi
      - name: Compile and test
        working-directory: src/${{ matrix.service }}
        run: npm test
      - name: Normalize coverage paths
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 scripts/normalize_coverage.py "$SERVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

  go:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, orders]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: src/${{ matrix.service }}/go.sum
      - name: Compile and test
        working-directory: src/${{ matrix.service }}
        run: |
          go build -mod=readonly ./...
          go test -mod=readonly -race -coverprofile=coverage.out ./...
      - name: Normalize coverage paths
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 scripts/normalize_coverage.py "$SERVICE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: src/${{ matrix.service }}/coverage.out
          if-no-files-found: error
          retention-days: 30

  python:
    name: Test cart and promotion policies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.16'
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Install locked dependencies
        run: |
          pip install --only-binary=:all: --require-hashes -r src/cart/requirements-dev.lock
      - name: Test CI policies and collect script coverage
        run: |
          mkdir -p coverage
          python -m coverage run --rcfile=.ci/coverage.ini -m unittest discover -s tests -v
          python -m coverage xml --rcfile=.ci/coverage.ini
          python -m coverage report --rcfile=.ci/coverage.ini
      - name: Normalize CI coverage paths
        run: python3 scripts/normalize_coverage.py ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-ci
          path: coverage/ci-coverage.xml
          if-no-files-found: error
          retention-days: 30
      - name: Compile and test cart
        working-directory: src/cart
        env:
          CART_PERSISTENCE_PROVIDER: in-memory
        run: |
          python -m compileall -q app
          python -m pytest --cov=app --cov-report=xml:coverage/coverage.xml --cov-report=term tests
      - name: Normalize coverage paths
        run: python3 scripts/normalize_coverage.py cart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-cart
          path: src/cart/coverage/coverage.xml
          if-no-files-found: error
          retention-days: 30

  security:
    name: SAST, secrets and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: mkdir -p reports
      - name: Semgrep SAST
        run: bash scripts/sast.sh
      - name: Gitleaks full history
        if: ${{ !cancelled() }}
        run: bash scripts/secrets.sh
      - name: Install Trivy
        if: ${{ !cancelled() }}
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Trivy dependency gate
        if: ${{ !cancelled() }}
        run: bash scripts/trivy.sh fs . reports/dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-code
          path: reports/
          retention-days: 30

  infrastructure-security:
    name: Checkov Dockerfiles and infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/iac.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-infrastructure
          path: reports/
          retention-days: 30

  quality:
    name: SonarCloud quality gate
    needs: [typescript, go, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require SonarCloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          : "${SONAR_TOKEN:?Configure SONAR_TOKEN}"
          : "${SONAR_PROJECT_KEY:?Configure SONAR_PROJECT_KEY}"
          : "${SONAR_ORGANIZATION:?Configure SONAR_ORGANIZATION}"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-ui
          path: src/ui/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-admin
          path: src/admin/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-checkout
          path: src/checkout/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-cart
          path: src/cart/coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-catalog
          path: src/catalog
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-orders
          path: src/orders
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-ci
          path: coverage
      - name: Scan and wait for quality gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
      - name: Enforce repository quality policy
        # Preserve metrics as evidence when the scanner rejects the remote gate.
        # A failed scanner still fails this job and the Source checks gate.
        if: ${{ !cancelled() && (steps.sonar.outcome == 'success' || hashFiles('.scannerwork/report-task.txt') != '') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: python3 scripts/sonar_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-report
          path: reports/
          retention-days: 30

  checks:
    name: Source checks gate
    if: always()
    needs: [typescript, go, python, security, infrastructure-security, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Failed or missing checks: ' + ', '.join(failed))
          PY
