sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=**/test/**,**/tests/**,**/*_test.go,tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.yarn/**,**/__pycache__/**,**/*.json,**/*.lock
sonar.javascript.lcov.reportPaths=src/ui/coverage/lcov.info,src/admin/coverage/lcov.info,src/checkout/coverage/lcov.info
sonar.python.coverage.reportPaths=src/cart/coverage/coverage.xml
sonar.go.coverage.reportPaths=src/catalog/coverage.out,src/orders/coverage.out
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
