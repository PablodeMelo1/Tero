# The current Cloud scanner discovers sources/tests across the repository.
# Keep application and CI code analyzed; exclude test fixtures only from metrics.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.yarn/**,**/__pycache__/**,**/*.json,**/*.lock
sonar.coverage.exclusions=tests/**,**/test/**,**/tests/**,**/*_test.go
sonar.cpd.exclusions=tests/**,**/test/**,**/tests/**,**/*_test.go
sonar.python.version=3.12
sonar.javascript.lcov.reportPaths=src/ui/coverage/lcov.info,src/admin/coverage/lcov.info,src/checkout/coverage/lcov.info
sonar.python.coverage.reportPaths=src/cart/coverage/coverage.xml,coverage/ci-coverage.xml
sonar.go.coverage.reportPaths=src/catalog/coverage.out,src/orders/coverage.out
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600
