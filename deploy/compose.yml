name: tero

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-node-health: &node-health
  <<: *health
  test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: orders
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U retail_user -d orders"]

  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      <<: *health
      test: [CMD, redis-cli, ping]

  catalog:
    image: ${IMAGE_CATALOG:?IMAGE_CATALOG is required}
    restart: unless-stopped
    environment:
      GIN_MODE: release
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: postgres
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_CATALOG_PERSISTENCE_DB_NAME: catalogdb
      RETAIL_CATALOG_PERSISTENCE_USER: retail_user
      RETAIL_CATALOG_PERSISTENCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /app/catalog, --healthcheck]

  carts:
    image: ${IMAGE_CART:?IMAGE_CART is required}
    restart: unless-stopped
    environment:
      CART_PERSISTENCE_PROVIDER: postgres
      CART_POSTGRES_HOST: db
      CART_POSTGRES_PORT: '5432'
      CART_POSTGRES_DB: cartdb
      CART_POSTGRES_USER: retail_user
      CART_POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]

  orders:
    image: ${IMAGE_ORDERS:?IMAGE_ORDERS is required}
    restart: unless-stopped
    environment:
      GIN_MODE: release
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_ORDERS_PERSISTENCE_NAME: orders
      RETAIL_ORDERS_PERSISTENCE_USERNAME: retail_user
      RETAIL_ORDERS_PERSISTENCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, /app/orders, --healthcheck]

  checkout:
    image: ${IMAGE_CHECKOUT:?IMAGE_CHECKOUT is required}
    restart: unless-stopped
    environment:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: redis://redis:6379
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:8080
    depends_on:
      redis: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck: *node-health

  ui:
    image: ${IMAGE_UI:?IMAGE_UI is required}
    restart: unless-stopped
    environment:
      RETAIL_UI_ENDPOINTS_CATALOG: http://catalog:8080
      RETAIL_UI_ENDPOINTS_CARTS: http://carts:8080
      RETAIL_UI_ENDPOINTS_CHECKOUT: http://checkout:8080
      RETAIL_UI_ENDPOINTS_ORDERS: http://orders:8080
    ports:
      - '${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:8080'
    depends_on:
      catalog: {condition: service_healthy}
      carts: {condition: service_healthy}
      checkout: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck: *node-health

  admin:
    image: ${IMAGE_ADMIN:?IMAGE_ADMIN is required}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: retail_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
    ports:
      - '${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-8081}:8080'
    depends_on:
      db: {condition: service_healthy}
    healthcheck: *node-health

volumes:
  db-data:
  redis-data:
